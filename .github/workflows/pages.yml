name: Aggiorna dati e pubblica

on:
  schedule:
    # fallback: the real trigger arrives every hour from an external service via workflow_dispatch, because GitHub
    # often delays or skips scheduled runs (see README, "Why once an hour")
    - cron: "17 * * * *"
  workflow_dispatch: {} # hourly trigger from the external service (cron-job.org) and manual from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the first round after a new field downloads much more
    env:
      DATA_DIR: ${{ github.workspace }}/data
      SCHEDULER_ENABLED: "0"
      THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }} # "Rilievo" basemap (public key, it ends up in the page)
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }} # Mapbox basemaps (public pk. token, it ends up in the page)
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }} # browser errors on Sentry (public DSN, it ends up in the page; empty = off)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history with the tags is needed for the version shown next to the name (git describe)

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      # already downloaded data carry over from one run to the next: only the new steps are downloaded
      - name: Recupera dati precedenti
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Scarica nuove corse e passi
        # a temporary error of one source must not block publishing the others
        run: python scripts/fetch_once.py || echo "::warning::alcuni download non sono riusciti, riprovo al prossimo giro"

      - name: Genera sito statico
        run: python scripts/build_static.py public

      - name: Salva dati per il prossimo giro
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # ~600 MB in about a thousand files: sometimes GitHub Pages stays in "syncing_files" beyond the default 10 minutes
          timeout: 1800000
