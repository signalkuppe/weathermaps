name: Aggiorna dati e pubblica

on:
  schedule:
    # riserva: l'avvio vero arriva ogni ora da un servizio esterno via workflow_dispatch, perché GitHub
    # ritarda o salta spesso gli avvii programmati (vedi README, "Perché una volta all'ora")
    - cron: "17 * * * *"
  workflow_dispatch: {} # avvio orario dal servizio esterno (cron-job.org) e manuale dalla scheda Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # il primo giro dopo una grandezza nuova scarica molto di più
    env:
      DATA_DIR: ${{ github.workspace }}/data
      SCHEDULER_ENABLED: "0"
      THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }} # sfondo "Rilievo" (chiave pubblica, finisce nella pagina)
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }} # sfondi Mapbox (token pubblico pk., finisce nella pagina)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # serve la storia con i tag per la versione mostrata accanto al nome (git describe)

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      # i dati già scaricati passano da un'esecuzione all'altra: si scaricano solo i passi nuovi
      - name: Recupera dati precedenti
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Scarica nuove corse e passi
        # un errore temporaneo di una sorgente non deve bloccare la pubblicazione delle altre
        run: python scripts/fetch_once.py || echo "::warning::alcuni download non sono riusciti, riprovo al prossimo giro"

      - name: Genera sito statico
        run: python scripts/build_static.py public

      - name: Salva dati per il prossimo giro
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # ~600 MB in un migliaio di file: a volte GitHub Pages resta in "syncing_files" oltre i 10 minuti di default
          timeout: 1800000
