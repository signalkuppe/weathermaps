name: Aggiorna dati e pubblica

on:
  schedule:
    # riserva: l'avvio vero arriva ogni ora da un servizio esterno via workflow_dispatch, perché GitHub
    # ritarda o salta spesso gli avvii programmati (vedi README, "Perché una volta all'ora")
    - cron: "17 * * * *"
  workflow_dispatch: {} # avvio orario dal servizio esterno (cron-job.org) e manuale dalla scheda Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_DIR: ${{ github.workspace }}/data
      SCHEDULER_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # serve la storia con i tag per la versione mostrata accanto al nome (git describe)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      # i dati già scaricati passano da un'esecuzione all'altra: si scaricano solo i passi nuovi
      - name: Recupera dati precedenti
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Scarica nuove corse e passi
        # un errore temporaneo di una sorgente non deve bloccare la pubblicazione delle altre
        run: python scripts/fetch_once.py || echo "::warning::alcuni download non sono riusciti, riprovo al prossimo giro"

      - name: Genera sito statico
        run: python scripts/build_static.py public

      - name: Salva dati per il prossimo giro
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
