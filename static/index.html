<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weathermaps</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C11 11 7 16 7 21a9 9 0 0 0 18 0c0-5-4-10-9-18z' fill='%231e9bff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.6.0/css/flag-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel" class="panel">
    <header class="panel-head">
      <h1>Weathermaps</h1>
      <div class="head-actions">
        <button id="share" class="icon-btn share-btn" type="button" title="Condividi la mappa che stai vedendo (WhatsApp…)">
          <!-- Lucide "share-2" (ISC) -->
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
          </svg>
          <span>Condividi</span>
        </button>
        <button id="collapse" class="icon-btn" type="button" aria-label="Riduci pannello" title="Riduci pannello">−</button>
      </div>
    </header>
    <div class="panel-body">
      <div class="row">
        <span class="label-info">Modello
          <button id="model-info-btn" class="info-btn" type="button" aria-label="Informazioni sul modello"
                  aria-expanded="false" aria-controls="model-info">
            <!-- Lucide "info" (ISC) -->
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
            </svg>
          </button>
        </span>
        <select id="model" class="rich-select" aria-label="Modello">
          <button><selectedcontent></selectedcontent></button>
        </select>
        <div id="model-info" class="model-info" role="note" hidden></div>
      </div>
      <label class="row" id="var-row" hidden>
        <span>Grandezza</span>
        <select id="var"></select>
      </label>
      <div class="run-block">
        <div class="run-head"><span>Corsa</span><span id="run-age" class="run-age"></span></div>
        <div id="run" class="runs" role="radiogroup" aria-label="Corsa del modello"></div>
        <div id="run-live" class="run-live" hidden>
          <span id="run-live-text"></span>
          <button id="refresh" class="refresh-btn" type="button" title="Controlla subito se sono usciti nuovi passi">↻ Aggiorna</button>
        </div>
        <div id="run-live-note" class="run-live-note" role="status"></div>
      </div>
      <div class="row" id="mode-row">
        <span>Modalità</span>
        <div class="seg" id="mode"></div>
      </div>

      <div class="time">
        <div id="valid" class="valid">—</div>
        <div id="range" class="range">—</div>
      </div>
      <div class="stepper">
        <button id="prev" class="icon-btn" type="button" title="Passo precedente (←)">‹</button>
        <button id="play" class="icon-btn" type="button" title="Play/Pausa (spazio)">▶</button>
        <button id="next" class="icon-btn" type="button" title="Passo successivo (→)">›</button>
        <input id="step" type="range" min="0" max="0" value="0" aria-label="Istante di previsione">
      </div>

      <label class="row">
        <span>Opacità</span>
        <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.55">
      </label>
      <label class="row check">
        <input id="crisp" type="checkbox">
        <span>Celle nette (senza interpolazione)</span>
      </label>
      <details id="points-box" class="points-box" open hidden>
        <summary>Punti <span id="points-unit"></span></summary>
        <ol id="points" class="points"></ol>
      </details>
      <div id="status" class="status" role="status"></div>
    </div>
  </aside>

  <div id="badge" class="badge" aria-live="polite"></div>
  <div id="share-toast" class="share-toast" role="status" hidden></div>
  <dialog id="share-dialog" class="share-dialog">
    <img id="share-preview" alt="Anteprima della mappa da condividere">
    <div class="share-actions">
      <button id="share-send" class="primary" type="button">Condividi</button>
      <button id="share-download" type="button">Scarica immagine</button>
      <button id="share-close" type="button">Chiudi</button>
    </div>
  </dialog>
  <div id="legend" class="legend"></div>
  <div id="probe" class="probe" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
